<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thailand Moto Trip Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1423;color:#eaf2ff;font:16px system-ui}header{padding:24px;background:#153653}h1{font-size:26px;margin:0}p{color:#b8ccdf}nav{display:flex;overflow:auto;gap:8px;padding:12px;background:#102039;position:sticky;top:0}button,.btn{font:inherit;background:#1d405b;color:white;border:1px solid #46718c;padding:11px;border-radius:10px;cursor:pointer;white-space:nowrap}.active,button[type=submit]{background:#087d80}main{max-width:1100px;margin:auto;padding:16px}.card,section{background:#14263b;border:1px solid #304d67;border-radius:14px;padding:18px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,textarea{display:block;width:100%;background:#0c192a;color:white;border:1px solid #4c6980;border-radius:8px;padding:12px;font:inherit;margin:6px 0 14px}input[type=checkbox]{display:inline;width:24px}label{display:block}a{color:#8ce2d9}.danger{background:#683344}dialog{background:#14263b;color:white;border:1px solid #4c6980;border-radius:14px;width:min(95vw,560px);max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}#message{padding:10px;color:#8ce2d9}small{color:#b8ccdf}.metric{font-size:28px;color:#8ce2d9}button:focus-visible,a:focus-visible{outline:3px solid #8ce2d9}</style><header><h1>🏍️ Thailand Moto Trip Studio</h1><p>ניהול טיול אופנועים בתאילנד • שמירה מקומית וגיבוי</p></header><nav id="tabs"></nav><div id="message" role="status"></div><main id="view"></main><dialog id="editor"></dialog><script>const KEY='thailand_moto_trip_v1',fresh=()=>({settings:{start:'',days:21,budget:0,currency:'ILS'},bookings:[],stops:[],places:[],gear:[],tasks:[]});const fields={bookings:[['name','תיאור הזמנה'],['type','סוג'],['status','סטטוס (לבדיקה / הוזמן / שולם / בוטל)'],['supplier','ספק'],['cost','מחיר כולל ₪','number'],['paid','שולם ₪','number'],['ref','מספר אישור / הזמנה'],['url','קישור להזמנה','url'],['notes','הערות']],stops:[['day','יום בטיול','number'],['place','מקום / יעד'],['kind','סוג עצירה'],['url','קישור לניווט','url'],['notes','תכנון והערות']],places:[['name','שם המקום'],['type','סוג'],['area','אזור'],['url','קישור למפות / אתר','url'],['notes','הערות / טלפון / שעות']],gear:[['name','פריט'],['category','קטגוריה'],['status','סטטוס'],['url','קישור לרכישה','url'],['guide','קישור להדרכת שימוש','url'],['notes','הערות']],tasks:[['title','משימה']]};const tabs=[['dashboard','סקירה'],['bookings','הזמנות'],['stops','מסלול'],['places','מקומות ושירותים'],['gear','ציוד והדרכות'],['tasks','משימות'],['settings','הגדרות וגיבוי']];let current='dashboard',db;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₪'+Number(n||0).toLocaleString('he-IL');function valid(d){if(!d||!d.settings||typeof d.settings!=='object'||Array.isArray(d.settings))return false;return Object.keys(fields).every(k=>Array.isArray(d[k])&&d[k].every(x=>x&&typeof x==='object'&&typeof x.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(x.id)))}try{const d=JSON.parse(localStorage.getItem(KEY));db=valid(d)?d:fresh()}catch(e){db=fresh()}function notify(s){$('#message').textContent=s}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));notify('נשמר במכשיר');return true}catch(e){notify('השמירה חסומה בדפדפן. ייצא גיבוי כדי לשמור את הנתונים.');return false}}function input(k,label,v,type='text'){return '<label>'+label+'<input name="'+k+'" type="'+type+'" value="'+esc(v)+'" '+(type==='number'?'min="0" step="any"':'')+'></label>'}function safeLink(u,label){try{const p=new URL(u);if(!['https:','http:'].includes(p.protocol))return '';return '<a target="_blank" rel="noopener noreferrer" href="'+esc(p.href)+'">'+label+' ↗</a>'}catch(e){return ''}}function go(k){current=k;notify('');render()}function render(){$('#tabs').innerHTML=tabs.map(([k,t])=>'<button data-tab="'+k+'" class="'+(current===k?'active':'')+'">'+t+'</button>').join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.tab));if(current==='dashboard'){const paid=db.bookings.reduce((s,x)=>s+Number(x.paid||0),0),total=db.bookings.filter(x=>['הוזמן','שולם'].includes(x.status)).reduce((s,x)=>s+Number(x.cost||0),0);$('#view').innerHTML='<div class="cards">'+[['תקציב יעד',money(db.settings.budget)],['שולם בפועל',money(paid)],['התחייבויות בהזמנות',money(total)],['משימות שבוצעו',db.tasks.filter(x=>x.done).length+'/'+db.tasks.length]].map(([t,v])=>'<section><small>'+t+'</small><div class="metric">'+v+'</div></section>').join('')+'</div><section><h2>תמונת מצב</h2><p>משך הטיול: '+esc(db.settings.days)+' ימים | תאריך יציאה: '+esc(db.settings.start||'טרם נקבע')+'</p><p>התחל בהגדרות הטיול והוסף הזמנות, עצירות, ציוד ומשימות. הנתונים שהזנת נשמרים רק בדפדפן הנוכחי.</p></section>';return}if(current==='settings'){settings();return}const type=current,items=type==='stops'?[...db[type]].sort((a,b)=>a.day-b.day):db[type];$('#view').innerHTML='<section><div class="row"><h2>'+tabs.find(x=>x[0]===type)[1]+'</h2><button id="add">+ הוסף פריט</button></div><div class="cards">'+items.map(x=>'<div class="card" data-id="'+esc(x.id)+'">'+(type==='tasks'?'<label><input type="checkbox" '+(x.done?'checked':'')+' aria-label="סימון משימה"> בוצע</label>':'')+fields[type].map(([k,t])=>x[k]!==undefined&&x[k]!==''?'<p><small>'+esc(t)+':</small> '+(['url','guide'].includes(k)?safeLink(x[k],'פתח קישור'):esc(x[k]))+'</p>':'').join('')+'<div class="row"><button data-action="edit">עריכה</button><button data-action="delete" class="danger">מחיקה</button></div></div>').join('')+'</div>'+(items.length?'':'<p>אין עדיין פריטים. לחץ על הוסף פריט כדי להתחיל.</p>')+'</section>';$('#add').onclick=()=>edit(type);$('#view').querySelectorAll('[data-id]').forEach(card=>{const id=card.dataset.id;card.querySelector('[data-action=edit]').onclick=()=>edit(type,id);card.querySelector('[data-action=delete]').onclick=()=>{if(confirm('למחוק את הפריט?')){db[type]=db[type].filter(x=>x.id!==id);save();render()}};const cb=card.querySelector('input[type=checkbox]');if(cb)cb.onchange=()=>{db[type].find(x=>x.id===id).done=cb.checked;save()}})}function edit(type,id){const old=id?db[type].find(x=>x.id===id):null;const item=old||{id:crypto.randomUUID(),done:false};$('#editor').innerHTML='<form><h2>'+ (old?'עריכת פריט':'הוספת פריט')+'</h2>'+fields[type].map(([k,t,kind])=>input(k,t,item[k]??(kind==='number'?0:''),kind)).join('')+'<div class="row"><button type="submit">שמור</button><button type="button" id="cancel">ביטול</button></div></form>';$('#cancel').onclick=()=>$('#editor').close();$('#editor form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);for(const [k,t,kind] of fields[type])item[k]=kind==='number'?Number(fd.get(k)):fd.get(k);if(!old)db[type].push(item);save();$('#editor').close();render()};$('#editor').showModal()}function settings(){$('#view').innerHTML='<section><h2>הגדרות הטיול</h2><form id="settingsform">'+input('start','תאריך יציאה מתוכנן',db.settings.start,'date')+input('days','מספר ימים',db.settings.days,'number')+input('budget','תקציב כולל ₪',db.settings.budget,'number')+'<button type="submit">שמור הגדרות</button></form></section><section><h2>גיבוי והעברת נתונים</h2><p>הנתונים נשמרים רק במכשיר ובדפדפן הנוכחיים. מחיקת נתוני הדפדפן עלולה למחוק אותם. מומלץ לייצא גיבוי לאחר שינויים.</p><p>הגיבוי כולל גרסת מבנה ומזהים קבועים, כהכנה לסנכרון עתידי בענן. הסנכרון עדיין אינו פעיל.</p><div class="row"><button id="export">יצוא גיבוי JSON</button><button id="reset" class="danger">איפוס נתונים</button></div><label>יבוא גיבוי JSON<input id="import" type="file" accept="application/json,.json"></label><small>יבוא מחליף את הנתונים הנוכחיים. שמור גיבוי לפני היבוא.</small></section>';$('#settingsform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.settings={...db.settings,start:f.get('start'),days:Number(f.get('days')),budget:Number(f.get('budget'))};save()};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='thailand-moto-trip-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#reset').onclick=()=>{if(confirm('למחוק את כל הנתונים במכשיר זה? מומלץ לייצא גיבוי תחילה.')){db=fresh();save();render()}};$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(parsed.schemaVersion&&parsed.schemaVersion!==1)throw Error('גרסת גיבוי אינה נתמכת');const d=parsed.data||parsed;if(!valid(d))throw Error('מבנה גיבוי לא תקין');if(!confirm('להחליף את הנתונים הנוכחיים בנתוני הגיבוי?'))return;db=d;save();render()}catch(err){notify('היבוא נכשל: '+err.message)}}}render();</script><script>
// Route payloads stay in the URL fragment and are never embedded in public source.
function loadRouteLink(){if(!location.hash.startsWith('#route='))return;try{const route=JSON.parse(decodeURIComponent(location.hash.slice(7)));if(!Array.isArray(route)||route.length>100||!route.every(x=>Array.isArray(x)&&Number.isInteger(x[0])&&x[0]>0&&x[0]<=365&&x.slice(1).every(v=>typeof v==='string'&&v.length<=2000)&&x.length===4))throw Error('קישור מסלול לא תקין');const next=JSON.parse(JSON.stringify(db));let added=0;route.forEach((x,i)=>{const [day,place,kind,notes]=x,id='route-link-'+i;if(!next.stops.some(s=>s.id===id||(s.day===day&&s.place===place))){next.stops.push({id,day,place,kind,notes,url:''});added++}});localStorage.setItem(KEY,JSON.stringify(next));db=next;current='stops';render();notify(added?'המסלול נטען ונשמר במכשיר. נתונים קיימים נשמרו.':'המסלול כבר קיים במכשיר.');history.replaceState(null,'',location.pathname+location.search)}catch(e){notify('טעינת המסלול נכשלה: '+e.message)}}
loadRouteLink();addEventListener('hashchange',loadRouteLink);
